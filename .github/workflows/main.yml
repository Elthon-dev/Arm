      - name: Validate Tool Wielder key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TOOL_WIELDER_KEY:-}" ]; then
            echo "TOOL_WIELDER_KEY is missing."
            exit 1
          fi

          echo "✓ TOOL_WIELDER_KEY present"

      - name: Start Tool Wielder
        shell: bash
        run: |
          set -euo pipefail

          nohup python3 /tmp/braincells_worker.py --worker \
            >/tmp/tool-wielder.log 2>&1 &

          echo $! > /tmp/tool-wielder.pid

          ready=0

          for _ in $(seq 1 90); do
            if curl -fsS \
              -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
              "http://127.0.0.1:${TOOL_PORT}/health" \
              >/dev/null 2>&1; then
              ready=1
              break
            fi

            if ! kill -0 "$(cat /tmp/tool-wielder.pid)" 2>/dev/null; then
              echo "Tool Wielder exited." >&2
              cat /tmp/tool-wielder.log >&2 || true
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Tool Wielder failed to start." >&2
            cat /tmp/tool-wielder.log >&2 || true
            exit 1
          fi

          echo "✓ Tool Wielder HTTP server online"

      - name: Test Tool Wielder API
        shell: bash
        run: |
          set -euo pipefail

          echo "========== /health =========="

          HEALTH="$(curl -fsS \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            "http://127.0.0.1:${TOOL_PORT}/health")"

          echo "$HEALTH" | jq .
          echo "$HEALTH" |
            jq -e '.ok == true and .service == "tool-wielder"' \
            >/dev/null

          echo
          echo "========== POST /warm =========="

          WARM="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "http://127.0.0.1:${TOOL_PORT}/warm")"

          echo "$WARM" | jq .
          echo "$WARM" |
            jq -e '.ok == true and .warmed == true' \
            >/dev/null

          echo
          echo "✓ GET /health passed"
          echo "✓ POST /warm passed"

      - name: Publish Tailscale endpoint
        shell: bash
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n1)"

          if [ -z "$TS_IP" ]; then
            echo "Could not determine Tailscale IPv4."
            exit 1
          fi

          echo "TOOL_WIELDER_IP=${TS_IP}" >> "$GITHUB_ENV"

          echo "========================================"
          echo " TOOL WIELDER ONLINE"
          echo "========================================"
          echo "Tailscale IPv4:"
          echo "$TS_IP"
          echo
          echo "API:"
          echo "http://${TS_IP}:${TOOL_PORT}"
          echo
          echo "Model:"
          echo "${TOOL_MODEL}"
          echo "========================================"

      - name: Verify remote Tailscale API
        shell: bash
        run: |
          set -euo pipefail

          echo "========== REMOTE /health =========="

          curl -fsS \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            "http://${TOOL_WIELDER_IP}:${TOOL_PORT}/health" |
            jq .

          echo
          echo "========== REMOTE POST /warm =========="

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "http://${TOOL_WIELDER_IP}:${TOOL_PORT}/warm" |
            jq .

          echo
          echo "✓ Remote /health passed"
          echo "✓ Remote POST /warm passed"

      - name: Keep Worker alive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " TOOL WIELDER READY"
          echo "========================================"
          echo "Endpoint: http://${TOOL_WIELDER_IP}:${TOOL_PORT}"
          echo "Model:    ${TOOL_MODEL}"
          echo "========================================"

          trap 'exit 0' TERM INT

          while true; do
            if ! kill -0 "$(cat /tmp/ollama.pid)" 2>/dev/null; then
              echo "Ollama died." >&2
              cat /tmp/ollama.log >&2 || true
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/tool-wielder.pid)" 2>/dev/null; then
              echo "Tool Wielder died." >&2
              cat /tmp/tool-wielder.log >&2 || true
              exit 1
            fi

            sleep 30
          done
