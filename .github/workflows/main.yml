name: Mr. Braincells - Tool Wielder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: braincells-tool-wielder
  cancel-in-progress: true

jobs:
  tool-wielder:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TOOL_MODEL: qwen3:1.7b

      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

      QWEN_CTX: "1024"
      QWEN_TIMEOUT: "90"
      PREWARM: "1"

      TOOL_PORT: "8765"
      WORKER_LISTEN_HOST: 0.0.0.0

      WORKSPACE: ${{ github.workspace }}
      MEMORY_FILE: ${{ github.workspace }}/data/tool_memory.jsonl

      COMMAND_TIMEOUT: "180"
      MAX_REQUEST_BODY: "8388608"
      MAX_FILE_READ: "524288"
      MAX_WEB_BYTES: "1048576"
      WEB_CACHE_TTL: "45"

      TOOL_WIELDER_KEY: ${{ secrets.TOOL_WIELDER_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          log-mode: quiet

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y curl jq tree ripgrep

          python3 --version
          curl --version | head -n1
          git --version

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          ollama --version

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail

          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_KEEP_ALIVE="$OLLAMA_KEEP_ALIVE" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            ollama serve \
            > /tmp/ollama.log 2>&1 &

          echo $! > /tmp/ollama.pid

          ready=0

          for _ in $(seq 1 90); do
            if curl -fsS \
              "http://${OLLAMA_HOST}/api/tags" \
              >/dev/null 2>&1; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Ollama failed to become ready." >&2
            cat /tmp/ollama.log >&2 || true
            exit 1
          fi

          echo "✓ Ollama online"

      - name: Pull Qwen Tool Brain
        shell: bash
        run: |
          set -euo pipefail

          ollama pull "$TOOL_MODEL"

          curl -fsS \
            "http://${OLLAMA_HOST}/api/tags" |
            jq -e --arg model "$TOOL_MODEL" \
            '.models | map(.name) | index($model) != null' \
            >/dev/null

          echo "✓ $TOOL_MODEL available"

