name: Mr. Braincells - Tool Wielder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: braincells-tool-wielder
  cancel-in-progress: true

jobs:
  tool-wielder:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TOOL_MODEL: qwen3:1.7b
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      TOOL_HOST: 0.0.0.0
      TOOL_PORT: "8765"
      MEMORY_FILE: data/tool_memory.jsonl
      COMMAND_TIMEOUT: "180"
      MAX_BODY: "2097152"
      MAX_READ: "262144"
      MAX_WEB_BYTES: "786432"
      WEB_CACHE_TTL: "45"
      WORKSPACE: ${{ github.workspace }}
      TOOL_WIELDER_KEY: ${{ secrets.TOOL_WIELDER_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl jq tree ripgrep python3

      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --hostname=braincells-tool-wielder-${{ github.run_id }}
          version: latest

      - name: Show Tailscale endpoint
        shell: bash
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n1)"

          echo "========================================"
          echo " TOOL WIELDER ONLINE"
          echo "========================================"

          echo "Tailscale IPv4:"
          echo "$TS_IP"
          echo

          echo "Tailnet status:"
          tailscale status || true
          echo

          echo "API: http://${TS_IP}:${TOOL_PORT}"
          echo "========================================"

          echo "TOOL_WIELDER_IP=${TS_IP}" >> "$GITHUB_ENV"

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          ollama --version

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail

          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_KEEP_ALIVE="$OLLAMA_KEEP_ALIVE" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            ollama serve \
            > /tmp/ollama.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -fsS \
              "http://${OLLAMA_HOST}/api/tags" \
              >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          curl -fsS \
            "http://${OLLAMA_HOST}/api/tags" \
            >/dev/null

          echo "✓ Ollama online"

      - name: Pull Tool Wielder model
        shell: bash
        run: |
          set -euo pipefail

          ollama pull "$TOOL_MODEL"

          echo "✓ $TOOL_MODEL available"

      - name: Patch and validate Tool Wielder /warm endpoint
        shell: python3 {0}
        run: |
          from pathlib import Path
          import sys

          path = Path("tool_wielder.py")

          if not path.exists():
              raise SystemExit(
                  "tool_wielder.py not found in repository root"
              )

          text = path.read_text(encoding="utf-8")

          # Add /warm only when it doesn't already exist.
          if 'self.path == "/warm"' not in text:

              marker = '''        if self.path == "/health":\n'''

              if marker not in text:
                  raise SystemExit(
                      "Could not locate Handler.do_GET() /health "
                      "route in tool_wielder.py"
                  )

              warm_block = '''        if self.path == "/warm":
            # Authenticated warm-up request.
            # Sends a tiny request to Ollama and keeps Qwen loaded.
            try:
                qwen.post_json("/api/chat", {
                    "model": QWEN_MODEL,
                    "messages": [
                        {
                            "role": "user",
                            "content": "ping"
                        }
                    ],
                    "stream": False,
                    "think": False,
                    "keep_alive": QWEN_KEEP_ALIVE,
                    "options": {
                        "num_ctx": 256,
                        "num_predict": 1,
                        "temperature": 0
                    }
                })

                self._json(
                    200,
                    {
                        "ok": True,
                        "model": QWEN_MODEL,
                        "warmed": True
                    }
                )

            except Exception as exc:
                self._json(
                    502,
                    {
                        "ok": False,
                        "error": (
                            f"warm failed: "
                            f"{type(exc).__name__}: {exc}"
                        )
                    }
                )

            return
'''

              text = text.replace(
                  marker,
                  warm_block + marker,
                  1
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "✓ Added authenticated GET /warm "
                  "to tool_wielder.py"
              )

          else:
              print("✓ /warm already exists in tool_wielder.py")

          # Make sure the worker actually uses the secret.
          if "TOOL_WIELDER_KEY" not in text:
              raise SystemExit(
                  "tool_wielder.py does not reference "
                  "TOOL_WIELDER_KEY"
              )

      - name: Start Tool Wielder
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TOOL_WIELDER_KEY" || {
            echo "TOOL_WIELDER_KEY secret is missing"
            exit 1
          }

          nohup python3 tool_wielder.py \
            > /tmp/tool-wielder.log 2>&1 &

          echo $! > /tmp/tool-wielder.pid

          for i in $(seq 1 60); do
            if curl -fsS \
              -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
              "http://127.0.0.1:${TOOL_PORT}/health" \
              >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          curl -fsS \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            "http://127.0.0.1:${TOOL_PORT}/health"

          echo
          echo "✓ Tool Wielder online"
          echo "✓ Remote API: http://${TOOL_WIELDER_IP}:${TOOL_PORT}"

      - name: Warm Tool Wielder and verify remote API
        shell: bash
        run: |
          set -euo pipefail

          echo "↳ Prewarming Qwen..."

          WARM_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            "http://127.0.0.1:${TOOL_PORT}/warm")"

          echo "$WARM_RESPONSE"

          echo
          echo "↳ Verifying authenticated /health..."

          curl -fsS \
            -H "Authorization: Bearer ${TOOL_WIELDER_KEY}" \
            "http://127.0.0.1:${TOOL_PORT}/health"

          echo
          echo "✓ Worker API verified"

      - name: Keep workflow alive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " TOOL WIELDER READY"
          echo "========================================"

          echo "Remote API:"
          echo "http://${TOOL_WIELDER_IP}:${TOOL_PORT}"

          echo "Model:"
          echo "${TOOL_MODEL}"

          echo "Workspace:"
          echo "${GITHUB_WORKSPACE}"

          echo "========================================"

          trap 'exit 0' TERM INT

          while true; do
            sleep 30
          done
