name: Qwen3 Tool Wielder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-wielder:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      OLLAMA_MODEL: qwen3:1.7b
      TOOL_WIELDER_KEY: ${{ secrets.TOOL_WIELDER_KEY }}
      TOOL_PORT: '8765'
      WORKER_LISTEN_HOST: '0.0.0.0'
      QWEN_HOST: '127.0.0.1:11434'
      QWEN_MODEL: qwen3:1.7b
      WORKSPACE: ${{ github.workspace }}
      PREWARM: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          sudo systemctl enable ollama
          sudo systemctl start ollama

          sleep 3

          ollama --version
          curl -fsS http://127.0.0.1:11434/api/version

      - name: Pull Qwen3
        shell: bash
        run: |
          set -euo pipefail

          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Show Tailscale address
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "TOOL WIELDER ONLINE"
          echo "======================================"

          tailscale ip -4 | head -1 > /tmp/tw-ip.txt
          cat /tmp/tw-ip.txt
          tailscale status

      - name: Upload endpoint
        uses: actions/upload-artifact@v4
        with:
          name: worker-endpoint
          path: /tmp/tw-ip.txt
          if-no-files-found: error

      - name: Preflight v6 worker
        shell: bash
        run: |
          set -euo pipefail

          ls -la braincells_type2_v6.py
          python3 -m py_compile braincells_type2_v6.py
          python3 --version

      - name: Start Tool Wielder (v6)
        shell: bash
        run: |
          set -euo pipefail

          python3 "$GITHUB_WORKSPACE/braincells_type2_v6.py" --worker &
          SERVER_PID=$!

          sleep 6

          IP="$(tailscale ip -4)"

          echo
          echo "======================================"
          echo "TOOL WIELDER (v6) ONLINE"
          echo "======================================"
          echo "Tailscale IPv4: $IP"
          echo "API: http://$IP:8765"
          echo "Model: $OLLAMA_MODEL"
          echo "======================================"
          echo

          echo "Health check:"
          curl -fsS \
            -H "Authorization: Bearer $TOOL_WIELDER_KEY" \
            "http://127.0.0.1:8765/health"

          echo
          echo "Review check:"
          curl -fsS \
            -H "Authorization: Bearer $TOOL_WIELDER_KEY" \
            "http://127.0.0.1:8765/help" \
            | grep -o '"review"' || echo "review check inconclusive"

          echo "======================================"
          echo "SERVER READY"
          echo "======================================"

          wait "$SERVER_PID"